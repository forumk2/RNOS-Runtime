# RNOS Hybrid Gate - CI Pipeline
#
# Demonstrates the Hybrid RNOS + Circuit Breaker compute gate on a 10-step
# pipeline with a deterministic two-phase failure sequence:
#
#   Phase 1 (steps 1-5): [0,1,1,1,1] - burst failures
#       In this implementation, the gate runs after each step outcome is
#       recorded. That produces the following expected progression:
#         Step 1: ALLOW
#         Step 2: ALLOW
#         Step 3: DEGRADE
#         Step 4: REFUSE
#
#   Phase 2 (steps 6-10): [0,1,0,1,0] - distributed failures
#       These steps are skipped once the gate refuses execution.
#
# Policy is loaded from rnos-policy.json at runtime.
# State is written to .rnos/state.json and updated after each step.

name: RNOS Hybrid Gate

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  rnos-hybrid-gate:
    name: RNOS Hybrid Compute Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize State
        run: ./scripts/update_state.ps1 -Init

      - name: Pipeline Step 1
        id: step_1
        run: |
          $f = [int](./scripts/simulate_failure.ps1 -Step 1)
          ./scripts/update_state.ps1 -Failure $f -Step 1
          ./scripts/hybrid_gate.ps1 -Step 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Pipeline Step 2
        id: step_2
        run: |
          $f = [int](./scripts/simulate_failure.ps1 -Step 2)
          ./scripts/update_state.ps1 -Failure $f -Step 2
          ./scripts/hybrid_gate.ps1 -Step 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Pipeline Step 3
        id: step_3
        run: |
          $f = [int](./scripts/simulate_failure.ps1 -Step 3)
          ./scripts/update_state.ps1 -Failure $f -Step 3
          ./scripts/hybrid_gate.ps1 -Step 3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Pipeline Step 4
        id: step_4
        continue-on-error: true
        run: |
          $f = [int](./scripts/simulate_failure.ps1 -Step 4)
          ./scripts/update_state.ps1 -Failure $f -Step 4
          ./scripts/hybrid_gate.ps1 -Step 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Pipeline Step 5
        id: step_5
        if: ${{ steps.step_4.outcome != 'failure' }}
        run: |
          $f = [int](./scripts/simulate_failure.ps1 -Step 5)
          ./scripts/update_state.ps1 -Failure $f -Step 5
          ./scripts/hybrid_gate.ps1 -Step 5
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Pipeline Step 6
        id: step_6
        if: ${{ steps.step_4.outcome != 'failure' }}
        run: |
          $f = [int](./scripts/simulate_failure.ps1 -Step 6)
          ./scripts/update_state.ps1 -Failure $f -Step 6
          ./scripts/hybrid_gate.ps1 -Step 6
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Pipeline Step 7
        id: step_7
        if: ${{ steps.step_4.outcome != 'failure' }}
        run: |
          $f = [int](./scripts/simulate_failure.ps1 -Step 7)
          ./scripts/update_state.ps1 -Failure $f -Step 7
          ./scripts/hybrid_gate.ps1 -Step 7
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Pipeline Step 8
        id: step_8
        if: ${{ steps.step_4.outcome != 'failure' }}
        run: |
          $f = [int](./scripts/simulate_failure.ps1 -Step 8)
          ./scripts/update_state.ps1 -Failure $f -Step 8
          ./scripts/hybrid_gate.ps1 -Step 8
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Pipeline Step 9
        id: step_9
        if: ${{ steps.step_4.outcome != 'failure' }}
        run: |
          $f = [int](./scripts/simulate_failure.ps1 -Step 9)
          ./scripts/update_state.ps1 -Failure $f -Step 9
          ./scripts/hybrid_gate.ps1 -Step 9
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Pipeline Step 10
        id: step_10
        if: ${{ steps.step_4.outcome != 'failure' }}
        run: |
          $f = [int](./scripts/simulate_failure.ps1 -Step 10)
          ./scripts/update_state.ps1 -Failure $f -Step 10
          ./scripts/hybrid_gate.ps1 -Step 10
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Assert Expected Gate Behavior
        if: ${{ always() }}
        run: |
          if ('${{ steps.step_1.outcome }}' -ne 'success') {
            throw 'Pipeline step 1 should succeed.'
          }
          if ('${{ steps.step_2.outcome }}' -ne 'success') {
            throw 'Pipeline step 2 should succeed.'
          }
          if ('${{ steps.step_3.outcome }}' -ne 'success') {
            throw 'Pipeline step 3 should degrade but not fail the workflow.'
          }
          if ('${{ steps.step_4.outcome }}' -ne 'failure') {
            throw 'Pipeline step 4 should refuse execution and close the gate.'
          }

          $state = Get-Content .rnos/state.json -Raw | ConvertFrom-Json
          $history = @($state.failureHistory) -join ','

          if ($history -ne '0,1,1,1') {
            throw "Expected failure history 0,1,1,1 but found $history."
          }
          if ([int]$state.consecutiveFailures -ne 3) {
            throw "Expected 3 consecutive failures at refusal, found $($state.consecutiveFailures)."
          }

          Write-Host 'Expected RNOS refusal observed at step 4; workflow passes.'
